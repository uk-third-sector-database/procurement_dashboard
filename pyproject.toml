[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "procurement-dashboard"
version = "0.0.1"
description = ""
readme = "README.md"
license = "BSD-3-Clause"
authors = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD 3-Clause License",
    "Operating System :: OS Independent"
]

# Explicitly declare which Python packages belong to this distribution.
# This mirrors your previous PDM configuration:
#   gui        -> src/gui
#   processing -> src/processing
#   utils      -> src/utils
packages = [
    { include = "gui", from = "src" },
    { include = "processing", from = "src" },
    { include = "utils", from = "src" }
]

[tool.poetry.dependencies]
# This encodes "==3.12.*" as a PEP 440 interval: 3.12 <= v < 3.13
python = ">=3.12,<3.13"
streamlit = ">=1.48.0"
ruff = ">=0.12.8"
polars = ">=1.32.3"
ipykernel = ">=6.30.1"
jsonschema2md = ">=1.7.0"
plotly = ">=6.3.0"
nbformat = ">=5.10.4"
duckdb = ">=1.3.2"
geopandas = ">=1.1.1"
matplotlib = ">=3.10.6"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
ruff = ">=0.3.0"
pyinstaller = ">=6.13.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.2.3"
sphinx-autoapi = ">=3.6.0"
furo = ">=2024.8.6"
pydata-sphinx-theme = ">=0.16.1"

[tool.poetry.urls]
Homepage = "https://github.com/uk-third-sector-database/procurement_dashboard"
"Bug Tracker" = "https://github.com/uk-third-sector-database/procurement_dashboard/issues"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
